name: Secret scan

# 公開リポジトリなので、API キーや鍵が入っていないかを毎回確かめる。
# 見つかったらジョブが失敗する。対処は docs/SETUP.md の「機密情報が検出されたとき」を参照。
on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 12:17(日本時間)に全履歴を調べ直す(ルールの更新で新たに見つかることがある)
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks(全履歴)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 過去のコミットに残った値も見つけるため、全履歴を取得する

      # 公式の Action はプッシュで増えたコミットだけを調べる(新しいブランチの初回プッシュでは0件になる)。
      # 確実に全履歴を調べるため、版を固定したバイナリをチェックサムで確かめてから直接実行する。
      - name: gitleaks を用意する
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 全履歴を調べる
        run: |
          echo "調べるコミット数: $(git rev-list --all --count)"
          if gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .; then
            echo "### 機密情報は見つかりませんでした" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 機密情報の可能性がある値が見つかりました"
              echo "ログで場所を確認し、docs/SETUP.md の「機密情報が検出されたとき」に沿って対処してください。"
              echo "値はまず無効にしてから、履歴から消します。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  forbidden-files:
    name: コミットしてはいけないファイル
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 鍵や設定ファイルが含まれていないか調べる
        run: |
          # 中身ではなくファイル名で判定する(署名鍵はバイナリなので gitleaks では見つけにくい)
          pattern='(^|/)(local\.properties|\.dev\.vars|\.env(\..+)?|google-services\.json|service-account.*\.json)$|\.(jks|keystore|p12|pfx|pem|key)$'
          found=$(git ls-files | grep -E "$pattern" | grep -vE '\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::コミットしてはいけないファイルがあります。履歴から消し、中の値を作り直してください。"
            echo "$found" | while read -r f; do echo "::error file=$f::$f"; done
            exit 1
          fi
          echo "問題なし"
