name: Secret scan

# 公開リポジトリなので、API キーや鍵が入っていないかを毎回確かめる。
# 見つかったらジョブが失敗する。対処は docs/SETUP.md の「機密情報が検出されたとき」を参照。
on:
  push:
  pull_request:
  schedule:
    # 毎週月曜 12:17(日本時間)に全履歴を調べ直す(ルールの更新で新たに見つかることがある)
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks(全履歴)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # 見つかった行にコメントを付ける
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml

  forbidden-files:
    name: コミットしてはいけないファイル
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 鍵や設定ファイルが含まれていないか調べる
        run: |
          # 中身ではなくファイル名で判定する(署名鍵はバイナリなので gitleaks では見つけにくい)
          pattern='(^|/)(local\.properties|\.dev\.vars|\.env(\..+)?|google-services\.json|service-account.*\.json)$|\.(jks|keystore|p12|pfx|pem|key)$'
          found=$(git ls-files | grep -E "$pattern" | grep -vE '\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::コミットしてはいけないファイルがあります。履歴から消し、中の値を作り直してください。"
            echo "$found" | while read -r f; do echo "::error file=$f::$f"; done
            exit 1
          fi
          echo "問題なし"
