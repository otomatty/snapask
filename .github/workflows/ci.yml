name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで新しいプッシュがあれば、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: サーバーの型チェックとテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 公開用のビルドが通るか確かめる(公開はしない)
        run: npx wrangler deploy --dry-run --outdir dist

  android:
    name: アプリのビルド
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      SNAPASK_API_BASE_URL: ${{ vars.SNAPASK_API_BASE_URL }}
      SNAPASK_GOOGLE_WEB_CLIENT_ID: ${{ vars.SNAPASK_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # キャッシュの書き込みは main だけ(プルリクエストは読むだけ)
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # CI では署名鍵を使わない(鍵が要るのはリリースのときだけ。release.yml を参照)。
      # ここでの APK はデバッグ用の鍵で署名されるため、Google ログインは通らない。
      - run: ./gradlew assembleRelease lintRelease --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: ワークフローの検査
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
