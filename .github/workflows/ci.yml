name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  worker:
    name: サーバーの型チェックとテスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: アプリのビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      SNAPASK_API_BASE_URL: ${{ vars.SNAPASK_API_BASE_URL }}
      SNAPASK_GOOGLE_WEB_CLIENT_ID: ${{ vars.SNAPASK_GOOGLE_WEB_CLIENT_ID }}
      SNAPASK_KEYSTORE_PASSWORD: ${{ secrets.SNAPASK_KEYSTORE_PASSWORD }}
      SNAPASK_KEY_ALIAS: ${{ secrets.SNAPASK_KEY_ALIAS }}
      SNAPASK_KEY_PASSWORD: ${{ secrets.SNAPASK_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.SNAPASK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # 鍵が登録されていれば、それで署名する(登録がなければビルドの確認だけになる)
      - name: 署名鍵を配置する
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > snapask.jks
          echo "SNAPASK_KEYSTORE_FILE=snapask.jks" >> "$GITHUB_ENV"

      - run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: snapask-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
