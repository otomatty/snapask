name: Deploy worker

# main の worker/ が変わったら、テストのあとサーバーを公開する。
# Variables の SNAPASK_D1_DATABASE_ID を登録するまでは動かない(手元から公開する運用のままでよい)。
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# 公開は1つずつ順番に行う(途中で止めない)
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: テストして公開する
    if: vars.SNAPASK_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SNAPASK_API_BASE_URL }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.SNAPASK_D1_DATABASE_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.SNAPASK_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 必要な設定がそろっているか確かめる
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::未設定:$missing(docs/SETUP.md の 9 章を参照)"
            exit 1
          fi

      # リポジトリの wrangler.jsonc は仮の値のままにしておき、公開のときだけ本物の値を入れる
      - name: 設定値を入れる
        run: |
          sed -i \
            -e "s|REPLACE_WITH_D1_DATABASE_ID|${D1_DATABASE_ID}|" \
            -e "s|REPLACE_WITH_WEB_CLIENT_ID.apps.googleusercontent.com|${GOOGLE_WEB_CLIENT_ID}|" \
            wrangler.jsonc
          if grep -q "REPLACE_WITH_" wrangler.jsonc; then
            echo "::error::wrangler.jsonc に仮の値が残っています"
            exit 1
          fi

      - name: データベースを更新する
        run: npx wrangler d1 migrations apply snapask --remote

      - name: 公開する
        run: npx wrangler deploy

      - name: 動いているか確かめる
        if: vars.SNAPASK_API_BASE_URL != ''
        env:
          BASE_URL: ${{ vars.SNAPASK_API_BASE_URL }}
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS "$BASE_URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::$BASE_URL/health が応答しません"
          exit 1
